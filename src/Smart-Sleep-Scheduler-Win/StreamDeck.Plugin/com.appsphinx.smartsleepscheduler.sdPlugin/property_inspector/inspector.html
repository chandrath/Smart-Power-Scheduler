<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Smart Sleep Scheduler Settings</title>
    <link rel="stylesheet" href="inspector.css" />
</head>
<body>
    <div class="sdpi-wrapper">
        <div class="card">
            <div class="sdpi-item">
                <div class="sdpi-item-label">Power Action</div>
                <div class="sdpi-item-value">
                    <select id="actionSelect">
                        <option value="Sleep">Sleep (Default)</option>
                        <option value="Hibernate">Hibernate</option>
                        <option value="Shutdown">Shutdown</option>
                        <option value="Restart">Restart</option>
                        <option value="ForceShutdown">Force Shutdown</option>
                        <option value="ForceRestart">Force Restart</option>
                    </select>
                </div>
                <div class="hint-text">Action to execute when countdown completes</div>
            </div>
        </div>

        <div class="card">
            <div class="sdpi-item">
                <div class="sdpi-item-label">Timer Duration</div>
                <div class="sdpi-item-value">
                    <select id="presetSelect">
                        <option value="5">5 Minutes</option>
                        <option value="15">15 Minutes</option>
                        <option value="30" selected>30 Minutes (Recommended)</option>
                        <option value="45">45 Minutes</option>
                        <option value="60">1 Hour (60m)</option>
                        <option value="120">2 Hours (120m)</option>
                        <option value="180">3 Hours (180m)</option>
                        <option value="custom">Custom Duration...</option>
                    </select>
                </div>
            </div>

            <div class="sdpi-item" id="customDurationRow" style="display: none; margin-top: 8px;">
                <div class="sdpi-item-label">Custom Duration (Minutes)</div>
                <div class="sdpi-item-value">
                    <input type="number" id="customDurationInput" min="1" max="720" value="30" />
                </div>
            </div>
        </div>

        <div class="card">
            <div class="sdpi-item">
                <div class="sdpi-item-label">Sound & Feedback</div>
                <label class="checkbox-container">
                    <input type="checkbox" id="soundCheckbox" />
                    <span>Play sound on completion</span>
                </label>
                <div class="hint-text">Uses the active sound scheme from desktop settings</div>
            </div>
        </div>
    </div>

    <script src="inspector.js"></script>
</body>
</html>
